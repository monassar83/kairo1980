name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    # Docs and the zone spreadsheet never reach the browser, so a change to
    # them alone should not spend a deployment.
    paths-ignore:
      - '**.md'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/fetch-reviews.yml'
  workflow_dispatch:
  # Called by fetch-reviews.yml: a push made with GITHUB_TOKEN deliberately
  # does not trigger other workflows, so refreshed reviews would otherwise sit
  # in the repo without ever reaching the live site.
  workflow_call:

permissions:
  contents: read

# A deploy publishes the whole directory, so two overlapping runs would race
# to define "current". Queue them instead, and never cancel a half-finished
# upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # build-sitemap.py dates each URL from the last commit that touched
          # it, which needs more than the default single-commit checkout.
          fetch-depth: 0

      # 24, not 22: the payment tests run against a real SQLite database
      # through node:sqlite, which is only stable from 24.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Guards against publishing a site whose scripts cannot parse. The pages
      # have no build step, so this is the only thing standing between a typo
      # in config.js and a dead basket in production.
      - name: Check that the browser scripts parse
        run: |
          for file in lang.js config.js order.js app.js qr.js pay.js zones.js fetch-reviews.js; do
            node --check "$file"
            echo "ok: $file"
          done

      - name: Install dependencies
        run: npm ci

      # Money. Nothing reaches production without these passing: pricing,
      # the payment state machine, and the whole checkout against a stubbed
      # PayPal — including the declines, replays and lost callbacks.
      - name: Run the test suite
        run: npm test

      # A placeholder database id would fail inside wrangler with a message
      # that explains nothing. Fail here instead, saying exactly what to do.
      - name: Check the payments database is configured
        run: |
          if grep -q 'PASTE_D1_DATABASE_ID_HERE' wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has the placeholder database_id."
            echo "Run 'npx wrangler d1 create kairo1980-payments' and paste the id it prints."
            exit 1
          fi
          echo "ok: d1 database id is set"

      # The schema has to exist before the Worker that writes to it goes live.
      # Applying migrations is idempotent: already-applied ones are skipped.
      - name: Apply database migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.114.0'
          command: d1 migrations apply kairo1980-payments --remote

      # zones.js is generated. If someone edited the spreadsheet and forgot to
      # rebuild — or hand-edited zones.js — the published prices would silently
      # disagree with the source of truth. Rebuild and compare.
      - name: Verify zones.js matches the spreadsheet
        run: |
          python -m pip install --quiet openpyxl
          cp zones.js zones.js.published
          python tools/build-zones.py
          if ! diff -q zones.js.published zones.js > /dev/null; then
            echo "::error::zones.js is out of date. Run 'python tools/build-zones.py' and commit the result."
            diff zones.js.published zones.js || true
            exit 1
          fi
          rm zones.js.published
          echo "ok: zones.js matches data/delivery_zones.xlsx"

      # Dates come from git history, so the published sitemap is accurate
      # without anyone remembering to edit it. Regenerated rather than
      # verified: there is no reason for a human to hand-maintain this file.
      - name: Regenerate sitemap.xml
        run: |
          python tools/build-sitemap.py
          python -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')"
          echo "sitemap.xml is well-formed"

      # v4 of the action runs on Node 24. v3 targeted Node 20, which GitHub has
      # deprecated and was already force-running on 24. v4's only breaking
      # change is its default Wrangler version, which does not affect us: the
      # version is pinned explicitly below.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned rather than floating so a deploy cannot break on its own.
          wranglerVersion: '4.114.0'
          command: deploy

      # IndexNow tells Bing, Yandex, Seznam and Naver that the page changed
      # instead of waiting to be crawled again. Google does not participate —
      # for Google, freshness comes from the sitemap and Search Console.
      # The key is public by design: it is served at /<key>.txt to prove we
      # control the domain, so there is nothing to keep secret here.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          KEY=168e760065044f7d27e17028d7ef2c88a1e8c5a1b83da9f1
          curl -sS -X POST https://api.indexnow.org/IndexNow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{
              \"host\": \"kairo1980.de\",
              \"key\": \"$KEY\",
              \"keyLocation\": \"https://kairo1980.de/$KEY.txt\",
              \"urlList\": [
                \"https://kairo1980.de/\",
                \"https://kairo1980.de/impressum\",
                \"https://kairo1980.de/datenschutz\"
              ]
            }" -w '\nIndexNow HTTP %{http_code}\n'
