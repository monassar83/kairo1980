name: Fetch Google Reviews

on:
  # Once a week. Combined with the script's own monthly ceiling and 72h
  # spacing guard this keeps the Places API at roughly 4-5 billed calls a
  # month, with headroom for the occasional manual run.
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the 72h spacing guard (the monthly ceiling still applies)'
        type: boolean
        default: false

permissions:
  contents: write

# Never let a scheduled run and a manual run push at the same time.
concurrency:
  group: fetch-reviews
  cancel-in-progress: false

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fetch reviews from Google Places
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          FORCE_FETCH: ${{ inputs.force }}
        run: node fetch-reviews.js

      # Runs even when the fetch step failed: the request was still billed, and
      # request-log.json holds the spend. Losing it would hand back free calls.
      - name: Commit updated reviews
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reviews.json request-log.json
          if git diff --staged --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "Update Google reviews"
          git pull --rebase origin main
          git push
